<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">

<style>
:root{--bg:#FDF6E3;--ink:#2b2a27;--mute:#6b675e;--line:#e6dcc3;--acc:#8a5a10;--card:#fffaf0;--mod:#fff1c7;--new:#e3f4df;--err:#b3261e;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
main{max-width:820px;margin:0 auto;padding:0 16px 120px}
button{font:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button{font-size:.88rem;padding:6px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--card);color:var(--acc)}
.bar button.pri{background:var(--acc);color:#fff}
.status{font-size:.85rem;color:var(--mute);margin-left:auto;text-align:right}
.status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.busy{color:var(--acc)}
h1{font-size:1.2rem;margin:18px 0 4px}
.ttl{outline:none;border-radius:6px;padding:2px 30px 2px 8px;margin-left:-8px;cursor:text;position:relative;word-break:keep-all}
.ttl:hover{background:#fff8e6}
.ttl:focus{background:#fff;box-shadow:0 0 0 2px var(--line)}
.ttl::after{content:"✎";position:absolute;right:8px;top:2px;color:#b5ad98;font-size:.9rem}
.ttl.mod{background:var(--mod)}
.ttl:empty::before{content:"(제목을 쓰세요)";color:#b5ad98}
.list a b{display:block;font-weight:600;line-height:1.5;margin-bottom:2px}
.hint{color:var(--mute);font-size:.85rem;margin-bottom:22px}
.lock{max-width:360px;margin:18vh auto 0;text-align:center}
.lock h1{font-size:1.4rem;margin-bottom:18px}
.lock input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.lock button{margin-top:12px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-size:1rem}
.lock .msg{margin-top:12px;font-size:.9rem;color:var(--err);min-height:1.4em}
.list a{display:block;padding:12px 12px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.list a small{display:block;color:var(--mute);font-size:.8rem}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:12px 0 6px}
.tools button{font-size:.8rem;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.list details.dg{margin:0 0 6px;padding:0;border:0;font-size:1rem;color:var(--ink)}
.list details.dg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);font-weight:600;user-select:none}
.list details.dg>summary::-webkit-details-marker{display:none}
.list details.dg>summary::before{content:"▸";color:var(--acc);font-size:.85rem;width:12px;transition:transform .15s}
.list details.dg[open]>summary::before{transform:rotate(90deg)}
.list details.dg>summary .rel{font-size:.75rem;font-weight:600;color:#fff;background:var(--acc);border-radius:6px;padding:0 6px}
.list details.dg>summary .cnt{margin-left:auto;color:var(--mute);font-weight:400;font-size:.82rem}
.list details.dg>.items{padding:10px 0 6px 18px}
.row{position:relative;display:flex;align-items:flex-start;gap:6px}
.lno{flex:0 0 38px;text-align:right;color:#c9c3b6;font-size:.78rem;line-height:1.6;padding-top:5px;user-select:none;font-variant-numeric:tabular-nums}  /* 줄 번호 L숫자 · 옅은 회색 · 2026-10-01 사용자 지시 · 말하는 줄만 셈(이미지·⏳·🎬 제외) */
.row .ln{flex:1;min-width:0}
.ln{font-size:1.2rem;margin:0 0 .9em;padding:2px 30px 2px 8px;border-radius:6px;outline:none;border-left:3px solid transparent;white-space:pre-wrap;word-break:keep-all;min-height:1.6em}
.ln:focus{background:#fff;box-shadow:0 0 0 2px var(--line)}
.ln.q{font-size:1.12rem;border-left-color:var(--acc);color:#4a3a14}
.ln.eq{font-size:1.12rem;color:var(--acc)} .ln.end{font-weight:700;margin-top:1.4em}
.ln.mod{background:var(--mod)} .ln.new{background:var(--new)}
.ln:empty::before{content:"(빈 줄 — 내용을 쓰거나 Backspace로 삭제)";color:#b5ad98;font-size:1rem}
.del{position:absolute;right:4px;top:4px;border:0;background:none;color:#b5ad98;font-size:1rem;display:none}
.row:hover .del,.row:focus-within .del{display:block}
figure{margin:4px 0 1.4em;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
figure img{display:block;width:100%;height:auto;border-radius:6px;min-height:40px;background:#f3ecd8}
figcaption{font-size:.78rem;color:var(--mute);margin-top:6px;word-break:break-all}
.cut{color:var(--acc,#8a5a10);font-weight:600;text-align:center;margin:.4em 0 1.2em;padding:8px 10px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line)}
.fix{color:var(--mute);font-size:.88rem;margin:0 0 1em;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;word-break:break-all}
#ed details.ytt{margin:0 0 18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:.9rem;background:rgba(46,125,50,.06)}
#ed details.ytt>summary{cursor:pointer;font-weight:600}
#ed details.ytt pre{white-space:pre-wrap;word-break:keep-all;font-family:inherit;margin:10px 0 0;line-height:1.6}
#ed details{margin-top:40px;font-size:.86rem;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
#ed details pre{white-space:pre-wrap;font-family:inherit}
.legend span{display:inline-block;padding:0 6px;border-radius:4px;margin-right:6px}
.blk{position:relative}
.blk .xdel{position:absolute;right:8px;top:8px;border:1px solid var(--line);background:rgba(255,250,240,.92);color:var(--err);font-size:.85rem;padding:2px 9px;border-radius:8px;display:none;z-index:2}
.blk:hover .xdel,.blk:focus-within .xdel{display:block}
.ins{display:block;width:100%;border:0;background:none;color:transparent;font-size:.8rem;line-height:1;padding:3px 0;margin:-.55em 0 .1em;cursor:pointer;border-top:1px dashed transparent}
.ins:hover,.ins:focus{color:var(--acc);border-top-color:var(--line);outline:none}
@media (hover:none){.blk .xdel{display:block}.ins{color:#cdbf9f}}
.bar button:disabled{opacity:.4;cursor:default}
.hist{position:fixed;inset:0;z-index:20;background:rgba(43,42,39,.35);display:flex;justify-content:flex-end}
.hist .pane{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);padding:14px 16px}
.hist h2{font-size:1.05rem;margin:0 0 6px}
.hist .sub{color:var(--mute);font-size:.82rem;margin-bottom:12px}
.hist .it{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;margin-bottom:8px}
.hist .it .t{font-size:.86rem}
.hist .it .t small{color:var(--mute)}
.hist .it button{font-size:.8rem;padding:3px 10px;border-radius:8px;border:1px solid var(--acc);background:var(--card);color:var(--acc);margin:6px 6px 0 0}
.hist .it button.pri{background:var(--acc);color:#fff}
.hist .pv{font-size:.82rem;margin-top:8px;white-space:pre-wrap;word-break:break-all;line-height:1.55}
.hist .pv .rm{background:#fde2df} .hist .pv .ad{background:var(--new)}
.hist .close{float:right;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:.85rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';
/* ================= 설정 ================= */
const CFG = {
  dataRepo: 'oogamecooo-byte/ilgaemi-solo-scripts',
  branch: 'main',
  api: 'https://api.github.com',
  autosaveMs: 2500
};
let TOKEN = sessionStorage.getItem('isc_t') || null;
const LOCAL = new URLSearchParams(location.search).get('local'); // 로컬 시험용(localhost 전용·저장 비활성)
const LOCAL_OK = LOCAL && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

/* ================= 유틸 ================= */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64encBytes(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000){s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));}return btoa(s);}
function b64decBytes(b64){const bin=atob(String(b64).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
const utf8enc = s => new TextEncoder().encode(s);
const utf8dec = b => new TextDecoder().decode(b);
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const hhmm = () => { const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function setStatus(kind, txt){ const el=document.getElementById('status'); if(el){ el.className='status '+kind; el.textContent=txt; } }

/* ================= 잠금 해제 ================= */
async function unlock(pw){
  const r = await fetch('auth.enc.json?_='+Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('NOSETUP');
  const cfg = await r.json();
  const slots = cfg.slots || (cfg.ct ? [cfg] : []);
  if(!slots.length) throw new Error('NOSETUP');
  const km = await crypto.subtle.importKey('raw', utf8enc(pw), 'PBKDF2', false, ['deriveKey']);
  for(const sl of slots){
    try{
      const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64decBytes(sl.salt), iterations:cfg.iter||310000, hash:'SHA-256'},
        km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const pt = utf8dec(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64decBytes(sl.iv)}, key, b64decBytes(sl.ct))));
      const j = JSON.parse(pt); TOKEN = j.token; sessionStorage.setItem('isc_t', TOKEN); return;
    }catch(_){}
  }
  throw new Error('WRONGPW');
}

/* ================= GitHub API ================= */
async function gh(path, opts={}){
  const r = await fetch(`${CFG.api}/repos/${CFG.dataRepo}/contents/${encPath(path)}${opts.q||''}`, {
    method: opts.method||'GET', cache:'no-store',
    headers: Object.assign({Authorization:'Bearer '+TOKEN, Accept: opts.accept||'application/vnd.github+json'},
                           opts.body?{'Content-Type':'application/json'}:{}),
    body: opts.body?JSON.stringify(opts.body):undefined
  });
  if(r.status===401){ sessionStorage.removeItem('isc_t'); TOKEN=null; showLock('인증이 만료됐습니다. 다시 입력해 주세요.'); throw new Error('401'); }
  return r;
}
async function getText(path){
  if(LOCAL_OK){ const r=await fetch(encPath(path)+'?_='+Date.now()); return {text: await r.text(), sha:'local'}; }
  const r = await gh(path, {q:'?ref='+CFG.branch+'&_='+Date.now()});
  if(!r.ok) throw new Error('불러오기 실패 ('+r.status+')');
  const j = await r.json();
  return {text: utf8dec(b64decBytes(j.content)), sha: j.sha};
}
async function putText(path, text, sha, message){
  const r = await gh(path, {method:'PUT', body:{message, branch:CFG.branch, sha, content:b64encBytes(utf8enc(text))}});
  if(r.status===409 || r.status===422) return {conflict:true};
  if(!r.ok) throw new Error('저장 실패 ('+r.status+')');
  const j = await r.json(); return {sha: j.content.sha};
}
const imgCache = {};
async function imgUrl(path){
  if(LOCAL_OK) return encPath(path);
  if(imgCache[path]) return imgCache[path];
  const r = await gh(path, {q:'?ref='+CFG.branch, accept:'application/vnd.github.raw'});
  if(!r.ok) return null;
  return imgCache[path] = URL.createObjectURL(await r.blob());
}

/* ================= 화면: 잠금 ================= */
function showLock(msg){
  app.innerHTML = `<div class="lock"><img src="assets/icon-192.png" alt="" width="88" height="88" style="display:block;margin:0 auto 8px"><h1>일개미 대본방</h1>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="go">열기</button><div class="msg" id="msg">${esc(msg||'')}</div></div>`;
  const pw=document.getElementById('pw'), go=document.getElementById('go'), m=document.getElementById('msg');
  const run=async()=>{ go.disabled=true; m.style.color='var(--mute)'; m.textContent='여는 중…';
    try{ await unlock(pw.value); route(); }
    catch(e){ m.style.color='var(--err)'; m.textContent = e.message==='NOSETUP' ? '아직 토큰 설정 전입니다 (setup_token.mjs 실행 필요).' : '비밀번호가 맞지 않습니다.'; go.disabled=false; } };
  go.onclick=run; pw.addEventListener('keydown',e=>{ if(e.key==='Enter') run(); }); pw.focus();
}

/* ================= 화면: 목록 ================= */
async function showList(){
  app.innerHTML = `<div class="bar"><b>🐜 일개미 대본방</b><span class="status" id="status">불러오는 중…</span></div><div class="list" id="list"></div>`;
  let files;
  if(LOCAL_OK){ files=[{name:LOCAL}]; }
  else{
    const r = await gh('', {q:'?ref='+CFG.branch+'&_='+Date.now()});
    if(!r.ok){ setStatus('err','목록 실패 ('+r.status+')'); return; }
    files = (await r.json()).filter(f=>f.type==='file' && f.name.endsWith('.md') && f.name!=='README.md');
  }
  // 최신 게시물이 위로: 게시일(그 파일의 첫 커밋) 내림차순 → 같으면 마지막 수정 내림차순 → 파일명. 커밋 조회 실패 시 파일명 속 날짜로 대체.
  const fnDate = n => { const m=n.match(/(\d{4}-\d{2}-\d{2})/); return m?m[1]+'T00:00:00Z':''; };
  await Promise.all(files.map(async f=>{
    f.posted=fnDate(f.name); f.edited='';
    if(LOCAL_OK) return;
    try{
      const r = await fetch(`${CFG.api}/repos/${CFG.dataRepo}/commits?path=${encPath(f.name)}&sha=${CFG.branch}&per_page=100&_=${Date.now()}`,
        {cache:'no-store', headers:{Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github+json'}});
      if(!r.ok) return;
      const cs = await r.json();
      if(cs.length){ f.edited=cs[0].commit.committer.date; f.posted=cs[cs.length-1].commit.committer.date; }
    }catch(e){}
  }).concat(files.map(async f=>{
    // 카드 제목 = 대본 첫 줄의 '# 제목' (편집 화면에서 고친 제목) · 못 읽으면 파일명
    try{
      const t = LOCAL_OK ? await (await fetch(encPath(f.name)+'?_='+Date.now())).text()
        : await (await gh(f.name, {q:'?ref='+CFG.branch+'&_='+Date.now(), accept:'application/vnd.github.raw'})).text();
      f.title = ((t.match(/^#\s+(.*)$/m)||[])[1]||'').trim();
    }catch(e){}
  })));
  files.sort((a,b)=> (b.posted||'').localeCompare(a.posted||'') || (b.edited||'').localeCompare(a.edited||'') || b.name.localeCompare(a.name));
  const kst = s => s ? new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}) : '';
  const kstDay = s => s ? new Date(s).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}) : '';
  // 날짜별 묶음(Report Vault 방식): 기준 = 파일명 속 날짜(대본의 날짜) → 없으면 게시일(KST).
  // 최근 45일 = 일별 · 그보다 오래된 것 = 월별. 가장 최근 묶음만 기본 펼침, 나머지는 접힘(펼침 상태는 이 기기에 기억).
  const DAY_WINDOW = 45, WD = ['일','월','화','수','목','금','토'];
  const todayStr = new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
  const ago = d => Math.round((Date.parse(todayStr+'T00:00:00Z') - Date.parse(d+'T00:00:00Z'))/864e5);
  const groups = new Map();
  for(const f of files){
    const d = (f.name.match(/(\d{4}-\d{2}-\d{2})/)||[])[1] || kstDay(f.posted) || '날짜 없음';
    const key = /^\d{4}-/.test(d) && ago(d) > DAY_WINDOW ? d.slice(0,7) : d;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  const keys = [...groups.keys()].sort((a,b)=> b.localeCompare(a));
  const label = k => {
    if(/^\d{4}-\d{2}$/.test(k)) return (+k.slice(0,4))+'년 '+(+k.slice(5))+'월';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return k;
    const dt = new Date(k+'T00:00:00Z');
    return (+k.slice(5,7))+'월 '+(+k.slice(8))+'일 ('+WD[dt.getUTCDay()]+')';
  };
  const rel = k => { if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return ''; const n=ago(k); return n===0?'오늘':n===1?'어제':''; };
  const title = n => n.replace(/\.md$/,'').replace(/_?\d{4}-\d{2}-\d{2}_?/,' ').replace(/_/g,' ').replace(/\s+/g,' ').trim() || n;
  let saved = {}; try{ saved = JSON.parse(localStorage.getItem('isc_open')||'{}'); }catch(_){}
  const list = document.getElementById('list');
  if(!files.length){ list.innerHTML = '<p class="hint">대본이 아직 없습니다.</p>'; setStatus('', '0개'); return; }
  list.innerHTML = `<div class="tools"><button id="openAll">모두 펼치기</button><button id="closeAll">모두 접기</button></div>` +
    keys.map((k,i)=>{
      const fs = groups.get(k), open = (k in saved) ? saved[k] : i===0, r = rel(k);
      return `<details class="dg" data-k="${esc(k)}"${open?' open':''}><summary>${esc(label(k))}${r?` <span class="rel">${r}</span>`:''}<span class="cnt">${fs.length}개</span></summary><div class="items">` +
        fs.map(f=>`<a href="#/edit/${encodeURIComponent(f.name)}"><b>${esc(f.title||title(f.name))}</b><small>${f.title?esc(title(f.name))+' · ':''}${f.posted?'게시 '+kst(f.posted):'눌러서 열기'}${f.edited&&f.edited!==f.posted?' · 수정 '+kst(f.edited):''}</small></a>`).join('') +
        `</div></details>`;
    }).join('');
  const remember = () => { const o={}; list.querySelectorAll('details.dg').forEach(g=>o[g.dataset.k]=g.open); try{ localStorage.setItem('isc_open', JSON.stringify(o)); }catch(_){} };
  list.querySelectorAll('details.dg').forEach(g=> g.addEventListener('toggle', remember));
  document.getElementById('openAll').onclick = ()=> list.querySelectorAll('details.dg').forEach(g=>g.open=true);
  document.getElementById('closeAll').onclick = ()=> list.querySelectorAll('details.dg').forEach(g=>g.open=false);
  setStatus('', files.length+'개 · 날짜 '+keys.length+'묶음');
}

/* ================= 화면: 편집 ================= */
const IMG = /^!\[(.*?)\]\((.*?)\)\s*$/;
let ED = null; // {path, sha, head, footer, orig[], state[], dirty, saving, timer}

function parseMd(t){
  const k = t.indexOf('## <대본>'); if(k<0) throw new Error("'## <대본>' 줄이 없습니다");
  const head = t.slice(0,k) + '## <대본>\n';
  const lines = t.slice(k).split('\n');
  let end = lines.findIndex((l,i)=>i>0 && l.trim()==='---'); if(end<0) end=lines.length;
  const body = lines.slice(1,end).map(l=>l.trim()).filter(Boolean);
  const footer = lines.slice(end).join('\n');
  const items = body.map(s => IMG.test(s) ? {k:'img', md:s} : s.startsWith('⏳') ? {k:'fix', md:s} : s.startsWith('🎬') ? {k:'cut', md:s} : {k:'txt', md:s});  // 🎬 = 영상 전환 표시(인트로 브릿지 등 · 말하는 대본 밖 · 2026-10-01)
  return {head, footer, items};
}
function headWithTitle(){
  const t = (ED.title||'').trim();
  if(!t || t===ED.origTitle) return ED.head;          // 비우면 원래 제목 유지(제목 줄 삭제 방지)
  if(/^#\s+.*$/m.test(ED.head)) return ED.head.replace(/^#\s+.*$/m, () => '# '+t);
  return '# '+t+'\n\n'+ED.head;
}
function buildMd(){
  const body = ED.state.filter(i=>i.md.trim()).map(i=>i.md.trim()).join('\n\n');
  return headWithTitle() + '\n' + body + '\n\n' + ED.footer.replace(/^\n+/,'');
}
const cls = t => { t=t.trim(); return t.startsWith(':')?'q':t.startsWith('=')?'eq':t==='이상입니다.'?'end':''; };
const spokenChars = () => ED.state.filter(i=>i.k==='txt').map(i=>i.md).join('').replace(/\s/g,'').length;

async function showEdit(name){
  app.innerHTML = `<div class="bar"><button id="back">← 목록</button><button id="reload">↻ 최신본</button><button id="undo" title="방금 한 수정 되돌리기 (Ctrl/⌘+Z · 줄 삭제·추가·나누기 포함)" disabled>↶ 되돌리기</button><button id="hist" title="저장 기록에서 이전 판 보기·복원">🕘 기록</button><button class="pri" id="save">저장</button><span class="status" id="status">불러오는 중…</span></div><div id="ed"></div>`;
  document.getElementById('back').onclick = async()=>{ if(await flush()) location.hash='#/'; };
  document.getElementById('reload').onclick = async()=>{ if(ED&&ED.dirty&&!confirm('저장 안 된 수정이 있습니다. 버리고 최신본을 불러올까요?'))return; showEdit(name); };
  document.getElementById('save').onclick = ()=>flush();
  document.getElementById('undo').onclick = ()=>undo();
  document.getElementById('hist').onclick = ()=>showHistory();
  let got; try{ got = await getText(name); }catch(e){ setStatus('err', e.message); return; }
  const p = parseMd(got.text);
  ED = {path:name, sha:got.sha, head:p.head, footer:p.footer, orig:p.items.map(i=>i.md), state:p.items.map((it,n)=>({k:it.k, md:it.md, o:n})), dirty:false, saving:false, timer:null, undo:[], typing:null};
  const title = ((p.head.match(/^#\s+(.*)$/m)||[])[1]||'').trim();
  ED.title = ED.origTitle = title;
  const ed = document.getElementById('ed');
  ed.innerHTML = `<h1 class="ttl" id="ttl" title="눌러서 제목 고치기">${esc(title)}</h1><div class="hint"><b>제목</b>도 눌러서 고칠 수 있습니다 · 줄을 눌러 고치세요 · <b>Enter</b> = 아래 새 줄 · 빈 줄에서 <b>Backspace</b> = 삭제 · 줄 사이 <b>＋ 줄 추가</b> = 그 자리에 새 줄(이미지 앞뒤·맨 위도 가능) · 이미지·⏳ 칸의 <b>✕ 삭제</b> = 그 칸 빼기 · 실수했으면 <b>↶ 되돌리기</b>(Ctrl/⌘+Z) · 저장된 이전 판은 <b>🕘 기록</b>에서 복원 · 손을 떼면 ${CFG.autosaveMs/1000}초 뒤 자동 저장<br><span class="legend"><span style="background:var(--mod)">고친 줄</span><span style="background:var(--new)">새 줄</span></span>${LOCAL_OK?' · <b>로컬 시험 모드(저장 안 됨)</b>':''}</div><div id="doc"></div><details><summary>📝 메모 · 점검 로그 (읽기 전용)</summary><pre>${esc(p.footer.replace('## 📝 메모','').replace(/^[-\s]+/,''))}</pre></details>`;
  const tt = document.getElementById('ttl');
  const ytm = p.head.match(/<!-- YT-THUMBNAIL:START -->([\s\S]*?)<!-- YT-THUMBNAIL:END -->/);  // YT-Thumbnail 제안(대본 밖 · 읽기 전용 · 2026-09-30)
  if(ytm){ const d=document.createElement('details'); d.open=true; d.className='ytt'; d.innerHTML='<summary>🖼️ 썸네일 · 제목 · 첫 30초 제안 (YT-Thumbnail · 읽기 전용 · 말하는 대본 아님)</summary><pre>'+esc(ytm[1].trim())+'</pre>'; tt.after(d); }
  tt.contentEditable='plaintext-only'; if(tt.contentEditable!=='plaintext-only') tt.contentEditable='true';
  tt.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); tt.blur(); } });
  tt.addEventListener('paste', e=>{ e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain')||'').replace(/\s*\n\s*/g,' ')); });
  tt.addEventListener('input', ()=>{ typingSnap(-1); ED.title = tt.textContent.replace(/\s*\n\s*/g,' '); tt.classList.toggle('mod', ED.title.trim()!==ED.origTitle); touched(); });
  render(); setStatus('ok', '불러옴 '+hhmm()+' · '+spokenChars().toLocaleString()+'자');
}

function insBtn(at){ const b=document.createElement('button'); b.className='ins'; b.type='button'; b.textContent='＋ 여기에 줄 추가'; b.title='이 자리에 새 줄 추가';
  b.onmousedown=e=>e.preventDefault(); b.onclick=()=>insertLine(at); return b; }
function insertLine(at){ snap('줄 추가'); ED.state.splice(at,0,{k:'txt', md:'', o:null}); render(); touched(); focusAt(at,false); }
function removeBlock(n){ const it=ED.state[n]; const what = it.k==='img' ? '이 이미지' : '이 ⏳ 칸';
  if(!confirm(what+'를 대본에서 뺄까요? (저장소의 이미지 파일은 그대로 남습니다 · 실수면 ↶ 되돌리기)')) return;
  snap(what+' 삭제'); ED.state.splice(n,1); render(); touched(); }
function delBtn(n){ const x=document.createElement('button'); x.className='xdel'; x.type='button'; x.textContent='✕ 삭제'; x.title='이 칸을 대본에서 빼기'; x.onclick=()=>removeBlock(n); return x; }
function render(){
  const doc = document.getElementById('doc'); doc.innerHTML='';
  let lnN = 0;  // 말하는 줄 번호(L숫자) — 점검 스크립트(yt_check/secz_db_check) 번호와 같은 기준
  ED.state.forEach((it,n)=>{
    doc.appendChild(insBtn(n));
    if(it.k==='img'){
      const m = it.md.match(IMG); const parts = m[1].split('|').map(s=>s.trim());
      const f = document.createElement('figure'); f.className='blk';
      f.innerHTML = `<img alt="${esc(parts[0]||'')}"><figcaption>📎 ${esc(parts[0]||'')}${parts[1]?` · <a href="${esc(parts[1])}" target="_blank" rel="noopener">${esc(parts[1])}</a>`:''}${parts[2]?' · '+esc(parts[2]):''}</figcaption>`;
      f.appendChild(delBtn(n)); doc.appendChild(f);
      imgUrl(m[2]).then(u=>{ if(u) f.querySelector('img').src=u; else f.querySelector('img').alt='⏳ 이미지 없음: '+m[2]; });
      return;
    }
    if(it.k==='cut'){ const w=document.createElement('div'); w.className='blk'; const d=document.createElement('div'); d.className='cut'; d.textContent=it.md; w.appendChild(d); w.appendChild(delBtn(n)); doc.appendChild(w); return; }
    if(it.k==='fix'){ const w=document.createElement('div'); w.className='blk'; const d=document.createElement('div'); d.className='fix'; d.textContent=it.md; w.appendChild(d); w.appendChild(delBtn(n)); doc.appendChild(w); return; }
    const row = document.createElement('div'); row.className='row';
    const lno = document.createElement('span'); lno.className='lno'; lno.textContent = 'L' + (++lnN); lno.setAttribute('aria-hidden','true'); row.appendChild(lno);
    const p = document.createElement('div'); p.className='ln '+cls(it.md);
    p.contentEditable='plaintext-only'; if(p.contentEditable!=='plaintext-only') p.contentEditable='true';
    p.textContent = it.md; p.dataset.i = n; mark(p,it);
    const x = document.createElement('button'); x.className='del'; x.textContent='✕'; x.title='이 줄 삭제';
    x.onmousedown = e=>{ e.preventDefault(); removeLine(n); };
    row.appendChild(p); row.appendChild(x); doc.appendChild(row);
  });
  doc.appendChild(insBtn(ED.state.length));
}
function mark(p,it){ p.classList.toggle('new', it.o===null); p.classList.toggle('mod', it.o!==null && it.md!==ED.orig[it.o]); }
function touched(){ ED.dirty=true; setStatus('busy','수정 중… (자동 저장 대기)'); clearTimeout(ED.timer); ED.timer=setTimeout(flush, CFG.autosaveMs); }
function focusAt(n,atEnd){ const el=document.querySelector('.ln[data-i="'+n+'"]'); if(!el)return; el.focus(); const r=document.createRange(); r.selectNodeContents(el); r.collapse(!atEnd); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
function removeLine(n){ snap('줄 삭제'); ED.state.splice(n,1); render(); touched(); let k=n-1; while(k>=0 && ED.state[k].k!=='txt') k--; if(k>=0) focusAt(k,true); }
function caretOffset(el){ const s=getSelection(); if(!s.rangeCount) return el.textContent.length; const r=s.getRangeAt(0).cloneRange(); r.selectNodeContents(el); r.setEnd(s.getRangeAt(0).endContainer, s.getRangeAt(0).endOffset); return r.toString().length; }

app.addEventListener('input', e=>{ const p=e.target; if(!p.classList||!p.classList.contains('ln')) return; typingSnap(+p.dataset.i); const it=ED.state[+p.dataset.i]; it.md=p.textContent.replace(/\n+/g,' '); p.className='ln '+cls(it.md); mark(p,it); touched(); });
app.addEventListener('paste', e=>{ if(!e.target.classList||!e.target.classList.contains('ln')) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain')||'').replace(/\s*\n\s*/g,' ')); });
app.addEventListener('keydown', e=>{
  const p=e.target; if(!p.classList||!p.classList.contains('ln')) return; const n=+p.dataset.i;
  if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); snap('줄 나누기'); const off=caretOffset(p), t=p.textContent;
    ED.state[n].md=t.slice(0,off).trimEnd(); ED.state.splice(n+1,0,{k:'txt', md:t.slice(off).trimStart(), o:null}); render(); touched(); focusAt(n+1,false); }
  else if(e.key==='Backspace' && p.textContent==='' && !e.isComposing){ e.preventDefault(); removeLine(n); }
});

/* ================= 되돌리기 (2026-10-22 · 사용자 지시 "대본방에서 그전 단계로 되돌리기 기능 추가. (실수로 삭제했을때)") =================
   ① 편집 중 되돌리기: 줄 삭제·추가·나누기·칸 삭제 직전, 그리고 글자 입력을 시작할 때(같은 줄에서 2초 넘게 쉬었다가 다시 칠 때) 지금 상태를 쌓아 두고, ↶ 되돌리기 / Ctrl·⌘+Z로 한 단계씩 되돌린다(최대 100단계 · 되돌린 상태도 자동 저장).
   ② 저장 기록 복원: 🕘 기록 = 이 대본의 저장 커밋 목록(최근 60개) → 미리보기(지금과 다른 줄) → 「이 판으로 되돌리기」 = 그 판 내용을 새 저장으로 올린다(기록은 지워지지 않음 · 되돌린 것도 다시 되돌릴 수 있음). */
function cloneState(){ return ED.state.map(i=>({k:i.k, md:i.md, o:i.o})); }
function snap(label){ if(!ED) return; ED.undo.push({state:cloneState(), title:ED.title, label}); if(ED.undo.length>100) ED.undo.shift(); ED.typing=null; const b=document.getElementById('undo'); if(b){ b.disabled=false; b.title='되돌리기: '+label+' (Ctrl/⌘+Z)'; } }
function typingSnap(i){ const now=Date.now(); if(!ED.typing || ED.typing.i!==i || now-ED.typing.t>2000) snap(i<0?'제목 고치기':'글자 고치기'); ED.typing={i, t:now}; }
function undo(){
  if(!ED || !ED.undo.length) return;
  const u = ED.undo.pop(); ED.state = u.state; ED.title = u.title; ED.typing=null;
  const tt=document.getElementById('ttl'); if(tt){ tt.textContent=ED.title; tt.classList.toggle('mod', (ED.title||'').trim()!==ED.origTitle); }
  render(); touched(); setStatus('busy','↶ 되돌림: '+u.label+' · 자동 저장 대기');
  const b=document.getElementById('undo'); if(b){ b.disabled=!ED.undo.length; b.title = ED.undo.length ? '되돌리기: '+ED.undo[ED.undo.length-1].label+' (Ctrl/⌘+Z)' : '되돌릴 수정 없음'; }
}
document.addEventListener('keydown', e=>{
  if(!ED || !(e.metaKey||e.ctrlKey) || e.shiftKey || e.altKey || e.key.toLowerCase()!=='z') return;
  if(document.querySelector('.hist')) return;
  e.preventDefault(); undo();
});
const kstFull = s => new Date(s).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
async function showHistory(){
  if(LOCAL_OK){ alert('로컬 시험 모드에서는 저장 기록을 볼 수 없습니다.'); return; }
  if(ED && ED.dirty && !(await flush())) { alert('지금 수정이 아직 저장되지 않았습니다. 저장한 뒤 다시 열어 주세요.'); return; }
  const ov=document.createElement('div'); ov.className='hist';
  ov.innerHTML='<div class="pane"><button class="close" id="hclose">닫기</button><h2>🕘 저장 기록</h2><div class="sub">자동 저장 한 번마다 한 줄입니다. 「미리보기」로 지금과 다른 줄을 보고, 「이 판으로 되돌리기」를 누르면 그 판이 새로 저장됩니다(기록은 지워지지 않습니다).</div><div id="hl">불러오는 중…</div></div>';
  document.body.appendChild(ov);
  const close=()=>ov.remove(); ov.querySelector('#hclose').onclick=close; ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  let cs;
  try{
    const r = await fetch(`${CFG.api}/repos/${CFG.dataRepo}/commits?path=${encPath(ED.path)}&sha=${CFG.branch}&per_page=60&_=${Date.now()}`,{cache:'no-store', headers:{Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github+json'}});
    if(!r.ok) throw new Error('기록 불러오기 실패 ('+r.status+')');
    cs = await r.json();
  }catch(e){ ov.querySelector('#hl').textContent=e.message; return; }
  const hl=ov.querySelector('#hl'); hl.innerHTML='';
  const curLines = ED.state.filter(i=>i.k==='txt').map(i=>i.md.trim());
  cs.forEach((c,idx)=>{
    const msg=c.commit.message.split('\n')[0]; const who = msg.startsWith('대본 수정:') ? '✍️ 내 수정' : '🤖 Claude';
    const d=document.createElement('div'); d.className='it';
    d.innerHTML=`<div class="t"><b>${esc(kstFull(c.commit.committer.date))}</b> · ${who}${idx===0?' · <b>지금 판</b>':''}<br><small>${esc(msg)} · ${c.sha.slice(0,7)}</small></div>`;
    if(idx>0){
      const pv=document.createElement('button'); pv.textContent='미리보기';
      const rb=document.createElement('button'); rb.className='pri'; rb.textContent='이 판으로 되돌리기';
      const box=document.createElement('div'); box.className='pv';
      let oldText=null;
      const load=async()=>{ if(oldText!==null) return oldText; const r=await gh(ED.path,{q:'?ref='+c.sha, accept:'application/vnd.github.raw'}); if(!r.ok) throw new Error('그 판 불러오기 실패 ('+r.status+')'); return oldText=await r.text(); };
      pv.onclick=async()=>{ try{ const t=await load(); const ol=parseMd(t).items.filter(i=>i.k==='txt').map(i=>i.md.trim());
          const rm=ol.filter(x=>!curLines.includes(x)), ad=curLines.filter(x=>!ol.includes(x));
          box.innerHTML = (!rm.length && !ad.length) ? '지금 판과 말하는 줄이 같습니다(이미지·제목·메모만 다를 수 있음).'
            : (rm.length?'<b>그 판에만 있던 줄 '+rm.length+'개</b> (되돌리면 다시 생김)\n'+rm.slice(0,15).map(x=>'<span class="rm">− '+esc(x)+'</span>').join('\n')+(rm.length>15?'\n…':'')+'\n':'')
            + (ad.length?'<b>지금 판에만 있는 줄 '+ad.length+'개</b> (되돌리면 사라짐)\n'+ad.slice(0,15).map(x=>'<span class="ad">+ '+esc(x)+'</span>').join('\n')+(ad.length>15?'\n…':''):'');
        }catch(e){ box.textContent=e.message; } };
      rb.onclick=async()=>{ if(!confirm(kstFull(c.commit.committer.date)+' 판으로 되돌릴까요?\n지금 판은 기록에 남아 있어서 나중에 다시 복원할 수 있습니다.')) return;
        try{ const t=await load(); setStatus('busy','되돌리는 중…');
          const res=await putText(ED.path, t, ED.sha, '대본 수정: '+ED.path+' (웹 편집기 · '+c.sha.slice(0,7)+' 판으로 되돌리기)');
          if(res.conflict){ alert('다른 곳에서 먼저 수정됐습니다. 「↻ 최신본」을 누른 뒤 다시 해 주세요.'); return; }
          close(); await showEdit(ED.path); setStatus('ok','✅ '+kstFull(c.commit.committer.date)+' 판으로 되돌림 '+hhmm());
        }catch(e){ alert(e.message); } };
      d.appendChild(pv); d.appendChild(rb); d.appendChild(box);
    }
    hl.appendChild(d);
  });
}

/* 저장: 충돌(다른 기기에서 먼저 저장)이면 덮어쓰지 않고 알림 */
async function flush(){
  if(!ED || !ED.dirty) return true;
  clearTimeout(ED.timer);
  if(LOCAL_OK){ setStatus('ok','(로컬 시험) 저장 생략 · '+spokenChars().toLocaleString()+'자'); ED.dirty=false; return true; }
  if(ED.saving){ ED.timer=setTimeout(flush, 800); return false; }
  ED.saving=true; setStatus('busy','저장 중…');
  try{
    const text = buildMd();
    const res = await putText(ED.path, text, ED.sha, '대본 수정: '+ED.path+' (웹 편집기)');
    if(res.conflict){
      setStatus('err','⚠️ 다른 곳에서 먼저 수정됨 — 「↻ 최신본」을 눌러 다시 불러오세요 (지금 수정은 아직 저장 안 됨)');
      ED.saving=false; return false;
    }
    ED.sha=res.sha; ED.dirty=false; ED.saving=false;
    setStatus('ok','✅ 저장됨 '+hhmm()+' · '+spokenChars().toLocaleString()+'자');
    return true;
  }catch(e){ ED.saving=false; if(e.message!=='401') setStatus('err','저장 실패 — '+e.message+' · 「저장」을 다시 눌러 주세요'); return false; }
}
window.addEventListener('beforeunload', e=>{ if(ED && ED.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });

/* ================= 라우팅 ================= */
function route(){
  if(!TOKEN && !LOCAL_OK) return showLock();
  const m = location.hash.match(/^#\/edit\/(.+)$/);
  if(m) return showEdit(decodeURIComponent(m[1]));
  ED=null; return showList();
}
window.addEventListener('hashchange', route);
route();
</script>
